services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  flask_bridge:
    build:
      context: ./bridge
      target: development
    
    volumes: !override
      - .:/workspace:cached # Relative to root directory because compose.yml is loaded first

    working_dir: /workspace

    # Allow more memory
    deploy:
      resources:
        limits:
          memory: 6G 

    # 2. Expose port 8080 locally so you can test in your Windows browser at http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"

    # 3. Development overrides
    environment:
      - FLASK_DEBUG=1
      - FLASK_ENV=development
      - PYTHONPATH=/workspace/bridge
      - DATABASE_URI=sqlite:////workspace/bridge-data/bridge.db
      - BASE_URL=http://flask_bridge:8080
      - ACTUAL_USERS_FILE=/workspace/config/actual-users.json
      - ACTUAL_PROVISIONER_URL=

    # 4. Overrides Gunicorn with an idle loop so the container stays running for VS Code.
    # This lets you press F5 in VS Code to run Flask with full breakpoint debugging.
    command: /bin/sh -c "while sleep 1000; do :; done"
 
  # Optional: Silence cloudflared during local development so it doesn't 
  # attempt to connect with invalid/missing tunnel tokens locally
  cloudflared:
    profiles: ["production-only"]

  # Per-user routing is only exercised in production
  caddy:
    profiles: ["production-only"]

  provisioner:
    profiles: ["production-only"]

  docker_gateway:
    profiles: ["production-only"]

  # A single Actual Budget server for local development
  actual_server:
    image: actualbudget/actual-server@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    container_name: actual_server
    volumes:
      - ./actual-data:/data
    networks:
      - budget_net
    ports:
      - "127.0.0.1:5006:5006"
